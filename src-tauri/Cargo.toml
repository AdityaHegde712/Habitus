[package]
name = "habit-tracker"
version = "0.1.0"
description = "Windows-local habit tracker"
authors = ["Aditya Hegde"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[[test]]
name = "day_policy"
path = "../tests/spec/day_policy.rs"

[[test]]
name = "history"
path = "../tests/spec/history.rs"

[[test]]
name = "backup_contract"
path = "../tests/spec/backup_contract.rs"

[[test]]
name = "import_export_contract"
path = "../tests/spec/import_export_contract.rs"

[[test]]
name = "repository"
path = "../tests/integration/repository.rs"
